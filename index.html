<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Tracking: Chaser vs Evader</title>
</head>

<body>

  <main>
    <div class="navbar">
      <button type="button">Configuration</button>
      <button type="button">Display Results</button>
    </div>

    <section class="configuration-section">
      <div class="parameters">
        <div class="grid-size">
          <label class="grid-size-label" for="grid-columns">
            Columns (X)
            <input id="grid-columns" name="columns" type="number" min="10" max="50" value="10">
          </label>
          <span aria-hidden="true">x</span>
          <label class="grid-size-label" for="grid-rows">
            Rows (Y)
            <input id="grid-rows" name="rows" type="number" min="10" max="50" value="10">
          </label>
        </div>

        <div class="chaser-algorithm">
          <label for="chaser-algorithm">Chaser algorithm</label>
          <select id="chaser-algorithm">
            <option value="">Choose an algorithm</option>
            <option value="bfs">Breadth-First Search (BFS)</option>
            <option value="gbfs">Greedy Best-First Search (GBFS)</option>
            <option value="astar">A* Search (A*)</option>
          </select>
        </div>

        <div class="evader-algorithm">
          <label for="evader-algorithm">Evader algorithm</label>
          <select id="evader-algorithm">
            <option value="">Choose an algorithm</option>
            <option value="rm">Random Movement (RM)</option>
            <option value="mm">Maximize Manhattan (MM)</option>
            <option value="msp">Maximize Shortest-Path (MSP)</option>
          </select>
        </div>

        <div class="move-delay">
          <label for="move-delay">Move delay</label>
          <output id="move-delay-value" for="move-delay">0.5 <span>sec</span></output>
          <input id="move-delay" class="range-input" type="range" min="0" max="2" step="0.1" value="0.5">
        </div>

        <div class="simulate-button">
          <button type="button" disabled>Simulate</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const moveDelay = document.querySelector("#move-delay");
    const moveDelayValue = document.querySelector("#move-delay-value");

    moveDelay.addEventListener("input", () => {
      moveDelayValue.textContent = `${Number(moveDelay.value).toFixed(1)} sec`;
    });
  </script>
</body>

</html>
